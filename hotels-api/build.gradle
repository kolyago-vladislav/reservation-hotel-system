plugins {
    id 'java'
    id 'org.openapi.generator' version '7.17.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}

group 'by.pilipuk'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.springframework.boot:spring-boot-starter:3.5.0")
    implementation("org.springframework.boot:spring-boot-starter-data-jpa:3.5.0")
    implementation("org.springframework.boot:spring-boot-starter-web:3.5.0")
    testImplementation("org.springframework.boot:spring-boot-starter-test:3.5.0")
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation("org.projectlombok:lombok:1.18.38")
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
    testCompileOnly 'org.projectlombok:lombok:1.18.38'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'

    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    implementation("org.postgresql:postgresql:42.7.7")

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'

    implementation 'jakarta.validation:jakarta.validation-api:3.1.0'

    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    implementation 'ch.qos.logback:logback-classic:1.4.11'

    implementation 'org.slf4j:slf4j-api:2.0.9'
}

test {
    useJUnitPlatform()
}

openApiGenerate {
    generatorName = "spring"
    inputSpec = "$projectDir/src/main/resources/reservation_api_description.yaml"
    outputDir = "$buildDir/generated"

    packageName = "by.pilipuk"
    apiPackage = "by.pilipuk.api"
    modelPackage = "by.pilipuk.dto"

    skipValidateSpec = true
    additionalProperties = [
            useJakartaEe: true
    ]

    configOptions = [
            openApiNullable: "false",
            interfaceOnly  : "true",
            useResponseEntity: "false",
            useTags: "true"
    ]
}

sourceSets {
    main {
        java {
            srcDir("$buildDir/generated/src/main/java")
        }
    }
}

tasks.compileJava {
    dependsOn tasks.openApiGenerate
}
