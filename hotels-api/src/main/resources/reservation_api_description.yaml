openapi: 3.0.4
info:
  title: Reservation API Specification for hotels
  description: |-
    A reservation API for users who want to get some rooms in hotels
  version: 1.0-SNAPSHOT
servers:
  - url: https://localhost:8080
paths:
  /v1/hotels/search:
    post:
      tags:
        - hotel
      summary: Get hotels by pagination with filter criteria
      description: Returns a list of all hotels in pages matching the search criteria provided in the request body
      operationId: getHotels
      parameters:
        - in: query
          name: page
          description: The number of page (starts from 0)
          schema:
            type: integer
            format: int32
            default: 0
        - in: query
          name: size
          description: The number of hotels in one page
          schema:
            type: integer
            format: int32
            default: 20
      requestBody:
        description: The search criteria
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelRequestDto'
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                  $ref: '#/components/schemas/HotelPageDto'

  /v1/hotels:
    post:
      tags:
        - hotel
      summary: Create a new hotel
      description: Creates a new hotel with address and room type counts
      operationId: createHotel
      requestBody:
        description: Hotel data to create
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelWriteDto'
      responses:
        201:
          description: Success

  /v1/hotels/{id}:
    get:
      tags:
        - hotel
      summary: Get hotel by id
      description: Returns hotel details by hotel id
      operationId: getHotelById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelDto'

  /v1/rooms/search:
    post:
      tags:
        - room
      summary: Get rooms by pagination with filter
      description: Returns a list of all rooms in pages matching the search filter provided in the request body
      operationId: getRooms
      parameters:
        - in: query
          name: page
          description: The number of page (starts from 0)
          schema:
            type: integer
            format: int32
            default: 0
        - in: query
          name: size
          description: The number of rooms in one page
          schema:
            type: integer
            format: int32
            default: 20
      requestBody:
        description: The search filter
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomRequestDto'
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomPageDto'

  /v1/rooms/{id}:
    get:
      tags:
        - room
      summary: Get room by id
      description: Returns room details by room id
      operationId: getRoomById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDto'

  /v1/dictionaries/countries:
    get:
      tags:
        - dictionary
      summary: get list of countries
      operationId: getCountries
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CountryDto'

  /v1/dictionaries/cities:
    get:
      tags:
        - dictionary
      summary: get list of cities
      description: get list of cities
      operationId: getCities
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CityDto'

  /v1/dictionaries/roomTypes:
    get:
      tags:
        - dictionary
      summary: get list of roomTypes
      operationId: getRoomTypes
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomTypeDto'

components:
  schemas:

    AddressWriteDto:
      type: object
      properties:
        street:
          type: string
        houseNumber:
          type: string
        cityId:
          type: integer
          format: int64

    HotelWriteDto:
      type: object
      properties:
        name:
          type: string
        rating:
          type: integer
          format: int64
        address:
          $ref: '#/components/schemas/AddressWriteDto'
        roomTypeCountWriteDto:
          type: array
          items:
            $ref: '#/components/schemas/RoomTypeCountWriteDto'

    RoomTypeCountWriteDto:
      type: object
      properties:
        roomTypeId:
          type: integer
          format: int64
        count:
          type: integer
          format: int64

    RoomDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
        roomTypeId:
          type: integer
          format: int64
        hotelId:
          type: integer
          format: int64

    AddressDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        street:
          type: string
        houseNumber:
          type: string
        cityId:
          type: integer
          format: int64

    HotelDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        rating:
          type: integer
          format: int32
        address:
          $ref: '#/components/schemas/AddressDto'
        roomTypeCountDto:
          type: array
          items:
            $ref: '#/components/schemas/RoomTypeCountDto'

    RoomRequestDto:
      description: Request dto provided in the request body to filter rooms
      type: object
      properties:
        roomTypeIds:
          type: array
          description: Filter by roomTypeIds
          nullable: true
          items:
            type: integer
            format: int64
        hotelIds:
          type: array
          description: Filter by hotelIds
          nullable: true
          items:
            type: integer
            format: int64
        roomIds:
          type: array
          description: Filter by roomIds
          nullable: true
          items:
            type: integer
            format: int64

    HotelRequestDto:
      description: Request dto provided in the request body to filter hotels
      type: object
      properties:
        names:
          type: array
          description: Filter by hotel name
          nullable: true
          items:
            type: string
        ratingFrom:
          type: integer
          format: int32
          description: filter by minimum rating of hotel (from 1 to 5).
          minimum: 1
          maximum: 5
          nullable: true
        ratingTo:
          type: integer
          format: int32
          description: filter by minimum rating of hotel (from 1 to 5).
          minimum: 1
          maximum: 5
          nullable: true
        cityIds:
          type: array
          description: filter by city id
          nullable: true
          items:
            type: integer
            format: int64

    RoomPageDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoomDto'
        totalCount:
          type: integer
          format: int64
        totalPages:
          type: integer

    HotelPageDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HotelDto'
        totalCount:
          type: integer
          format: int64
        totalPages:
          type: integer

    RoomTypeCountDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        count:
          type: integer
          format: int32

    CountryDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    CityDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    RoomTypeDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string