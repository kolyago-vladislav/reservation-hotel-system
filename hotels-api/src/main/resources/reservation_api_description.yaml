openapi: 3.0.4
info:
  title: Reservation API Specification for hotels
  description: |-
    A reservation API for users who want to get some rooms in hotels
  version: 1.0-SNAPSHOT
servers:
  - url: https://localhost:8080
paths:
  /v1/hotels/search:
    post:
      tags:
        - hotel
      summary: Get hotels by pagination with filter criteria
      description: Returns a list of all hotels in pages matching the search criteria provided in the request body
      operationId: getHotels
      parameters:
        - in: query
          name: page
          description: The number of page (starts from 0)
          schema:
            type: integer
            format: int32
            default: 0
        - in: query
          name: size
          description: The number of hotels in one page
          schema:
            type: integer
            format: int32
            default: 20
      requestBody:
        description: The search criteria
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelSearchCriteria'
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                  $ref: '#/components/schemas/PageHotelDto'
#createHotel
  /v1/hotels:
    post:
      tags:
        - hotel
      summary: Create a new hotel
      description: Creates a new hotel with address and room type counts
      operationId: addHotel
      requestBody:
        description: Hotel data to create
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelWriteDto'
      responses:
        201:
          description: Success

  /v1/hotels/{id}:
    get:
      tags:
        - hotel
      summary: Get hotel by id
      description: Returns hotel details by hotel id
      operationId: getHotelById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelDto'

#Post/v1/rooms/search
#roomTypesIds
  /v1/rooms:
    get:
      tags:
        - room
      summary: Get all rooms
      description: Returns rooms filtered by room types, hotel ids or room ids
      operationId: getAllRooms
      parameters:
        - name: dictRoomTypeIds
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: hotelIds
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: roomIds
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomDto'

  /v1/rooms/{id}:
    get:
      tags:
        - room
      summary: Get room by id
      description: Returns room details by room id
      operationId: getRoomById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDto'

#getCountries
#country
  /v1/dictionaries/countries:
    get:
      tags:
        - hotel
      summary: get list of dict countries
      operationId: getAllDictCountries
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DictCountryDto'

  #getCities
  #city
  /v1/dictionaries/cities:
    get:
      tags:
        - hotel
      summary: get list of cities
      description: get list of dict cities
      operationId: getAllDictCities
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DictCityDto'

  /v1/dictionaries/roomTypes:
    get:
      tags:
        - room
      summary: get list of dict roomTypes
      operationId: getAllDictRoomTypes
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DictRoomTypeDto'

components:
  schemas:

#Long cityId
    AddressWriteDto:
      type: object
      properties:
        street:
          type: string
        houseNumber:
          type: string
        cityId:
          type: string
#RoomTypeCountWriteDto
    HotelWriteDto:
      type: object
      properties:
        name:
          type: string
        rating:
          type: integer
          format: int64
        address:
          $ref: '#/components/schemas/AddressWriteDto'
        dictRoomTypeCountWriteDto:
          type: array
          items:
            $ref: '#/components/schemas/DictRoomTypeCountWriteDto'

#roomTypeId
    DictRoomTypeCountWriteDto:
      type: object
      properties:
        dictRoomType:
          type: string
        count:
          type: integer
          format: int64

#hotelId
    RoomDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
        roomTypeId:
          type: string
        hotel:
          type: string

    AddressDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        street:
          type: string
        houseNumber:
          type: string
        cityId:
          type: string

    HotelDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        rating:
          type: integer
          format: int32
        address:
          $ref: '#/components/schemas/AddressDto'
        roomTypeCountDto:
          type: array
          items:
            $ref: '#/components/schemas/DictRoomTypeCountDto'

#HotelRequestDto
    HotelSearchCriteria:
      description: The search criteria provided in the request body to filter hotels
      type: object
      properties:
        names:
          type: array
          description: Filter by hotel name
          nullable: true
          items:
            type: string
        ratingFrom:
          type: integer
          description: filter by minimum rating of hotel (from 1 to 5).
          minimum: 1
          maximum: 5
          nullable: true
        ratingTo:
          type: integer
          description: filter by minimum rating of hotel (from 1 to 5).
          minimum: 1
          maximum: 5
          nullable: true
        cityIds:
          type: integer
          description: filter by city id
          nullable: true
#HotelPageDto

    PageHotelDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HotelDto'
        totalCount:
          type: integer
          format: int64
        totalPages:
          type: integer


    DictRoomTypeCountDto:
      type: object
      properties:
        id:
          type: string
        count:
          type: integer
          format: int32

    DictCountryDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        country:
          type: string

    DictCityDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        city:
          type: string

    DictRoomTypeDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        RoomType:
          type: string